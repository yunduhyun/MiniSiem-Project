AWSTemplateFormatVersion: '2010-09-09'
Description: mini-siem 임시용 스택 (NAT, 보안 그룹, EC2, ALB, WAF)

Parameters:
  ProjectName:
    Type: String
    Default: mini-siem
    Description: 유지용 스택과 같은 값으로 설정한다.

  InstanceType:
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM Parameter Store에 저장된 AMI ID를 참조하기 위해 사용하는 특수 매개 변수 유형이다. 동적 AMI 참조와 자동 유효성 검증이 특징이다.

Resources:
  # NAT 게이트웨이용 고정 IP
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip'

  # NAT 게이트웨이 배포. 퍼블릭 서브넷 1곳에만 둔다 -> 비용 문제 ㅜㅜ
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      # NatEip.AllocationId에서 AllocationId는 EIP를 가리키는 ID이다.
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !ImportValue
        # Fn::Sub은 !sub의 정식 이름인데, !ImportValue와 같이 사용하면,
        # 일부 버전의 도구에서 오류 발생 가능성이 존재하니, 해당 방식으로 사용
        Fn::Sub: '${ProjectName}-PublicSubnet1Id'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat'

  # 프라이빗 라우트 테이블에 0.0.0.0/0 -> NAT 경로 추가
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !ImportValue
        Fn::Sub: '${ProjectName}-PrivateRouteTableId'
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ALB 보안 그룹, 인터넷에서 80번 포트만 허용한다.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB, HTTP from internet
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  # 웹 서버 보안 그룹, ALB에서 오는 80번 포트만 허용한다
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web servers, HTTP from ALB only
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web-sg'

  # SSM 접속을 위한 EC2 역할 생성
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web-role'

  # EC2에 붙이기 위한 인스턴스 프로파일 생성
  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebRole

  # 웹서버 1 -> 프라이빗 서브넷 1번에 배치. NAT 경로가 만들어진 후 부팅해야 Nginx 설치에 성공하니, DepandsOn을 사용한다
  Web1:
    Type: AWS::EC2::Instance
    DependsOn: PrivateDefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-PrivateSubnet1Id'
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref WebInstanceProfile
      UserData: !Base64 |
        #!/bin/bash
        dnf install -y nginx
        echo "mini-siem web1" > /usr/share/nginx/html/index.html
        systemctl enable --now nginx
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web1'

  # 웹 서버 2
  Web2:
    Type: AWS::EC2::Instance
    DependsOn: PrivateDefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-PrivateSubnet2Id'
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref WebInstanceProfile
      UserData: !Base64 |
        #!/bin/bash
        dnf install -y nginx
        echo "mini-siem web2" > /usr/share/nginx/html/index.html
        systemctl enable --now nginx
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web2'

  # 대상 그룹 생성. -> 웹 서버 1,2 묶고, / 경로로 상태 확인
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /
      Targets:
        - Id: !Ref Web1
        - Id: !Ref Web2
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-web-tg'

  # ALB 생성 -> 퍼블릭 서브넷 2곳에 생성 및 엑세스 로그 ALB 버킷에 로깅
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      # internet-facing은 공인 IP를 받아 인터넷에서 접속 가능한 상태일 때 사용하고, internal은 VPC 안에서만 사용할 때 쓴다
      # -> ALB 생성 시 인터넷 경계와 내부를 선택하는 것이다.
      Scheme: internet-facing
      Subnets:
        - !ImportValue
          Fn::Sub: '${ProjectName}-PublicSubnet1Id'
        - !ImportValue
          Fn::Sub: '${ProjectName}-PublicSubnet2Id'
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        # Access Log를 킨다
        - Key: access_logs.s3.enabled
          Value: 'true'
          # 로그를 저장할 S3 버킷 지정
        - Key: access_logs.s3.bucket
          Value: !ImportValue
            Fn::Sub: '${ProjectName}-AlbBucketName'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb'

  # ALB 리스너 설정. 80번 포트로 들어오는 요청을 로드 밸런싱 한다
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        # forward, redirect, fixed-response중 하나 선택하는 바로 그것 !
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # WAF 웹 ACL 설정. 기본동작은 허용이고, , AWS 관리형 규칙 2가지를 사용한다
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-web-acl'
      # REGIONAL은 ALB, API GW등 리전 단위에 사용하고, CLOUDFRONT는 Cloudfront에 배포한다.
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-web-acl'
      Rules:
        # XSS, 잘못된 요청 등 일반 공격 차단
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common-rule-set
        # SQL 인젝션 차단
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: sqli-rule-set

  # 웹 ACL을 ALB에 연결
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt WebAcl.Arn

  # WAF 로그를 S3 버킷으로 저장하는 로깅 설정
  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !ImportValue
          Fn::Sub: '${ProjectName}-WafBucketArn'

Outputs:
  AlbDnsName:
    Description: ALB 접속 주소. curl 테스트에 사용한다
    Value: !GetAtt Alb.DNSName
